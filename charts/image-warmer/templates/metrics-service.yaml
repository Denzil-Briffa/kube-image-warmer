{{- if .Values.operator.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "image-warmer.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "image-warmer.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "image-warmer.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 8443
      targetPort: metrics
{{- end }}
