# This rule is not used by the project kube-image-warmer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over cache.denzil-briffa.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kube-image-warmer
    app.kubernetes.io/managed-by: kustomize
  name: imagewarmuppolicy-admin-role
rules:
- apiGroups:
  - cache.denzil-briffa.github.io
  resources:
  - imagewarmuppolicies
  verbs:
  - '*'
- apiGroups:
  - cache.denzil-briffa.github.io
  resources:
  - imagewarmuppolicies/status
  verbs:
  - get
