{{- if .Values.registryCredentials.create }}
{{- $config := required "registryCredentials.dockerconfigjson is required when create=true" .Values.registryCredentials.dockerconfigjson }}
{{- $parsed := mustFromJson $config }}
{{- if not (hasKey $parsed "auths") }}
{{- fail "registryCredentials.dockerconfigjson must contain an auths object" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "image-warmer.fullname" . }}-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "image-warmer.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $config | b64enc | quote }}
{{- end }}
